<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="app-version" content="7.0.0">\n<meta name="theme-color" content="#6d5dfc"><meta name="description" content="歷史女神把我的段考變成異世界副本｜小說閱讀＋重點整理＋段考題練習">
<link rel="manifest" href="manifest.json"><link rel="icon" href="cover.png">
<title>歷史女神｜閱讀與段考練習</title>
<link rel="stylesheet" href="styles.css?v=7.0.0">
<script id="history-goddess-cache-migration-v7">
(()=>{try{
  if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));}
  if('caches'in window){caches.keys().then(keys=>keys.filter(k=>k.startsWith('history-goddess')).forEach(k=>caches.delete(k)));}
}catch(e){}})();
</script>
</head><body>
<div id="app">
  <header class="topbar">
    <button class="icon-btn" id="menuBtn" aria-label="目錄與書籤" title="目錄與書籤">☰</button>
    <div class="brand"><span class="brand-dot"></span><span>歷史女神</span></div>
    <div class="top-actions">
      <button class="icon-btn top-reader-only hidden" id="bookmarkTopBtn" aria-label="加入書籤" title="加入書籤">☆</button>
      <button class="icon-btn" id="layoutBtn" aria-label="切換手機版或電腦版" title="版面模式">▣</button>
      <button class="icon-btn" id="searchBtn" aria-label="搜尋" title="全文搜尋">⌕</button>
      <button class="icon-btn" id="settingsBtn" aria-label="閱讀設定" title="閱讀設定">Aa</button>
    </div>
  </header>

  <aside id="drawer" class="drawer">
    <div class="drawer-head"><b>閱讀導覽</b><button id="drawerClose" class="icon-btn">×</button></div>
    <div class="drawer-tabs">
      <button class="drawer-tab active" data-drawer-tab="chapters">目錄</button>
      <button class="drawer-tab" data-drawer-tab="bookmarks">書籤</button>
    </div>
    <div id="chapterList"></div>
    <div id="bookmarkList" class="hidden"></div>
  </aside><div id="shade" class="shade"></div>
  <main id="view"></main>
  <nav class="bottom-nav">
    <button data-route="home" class="nav-btn active"><span>⌂</span><small>首頁</small></button>
    <button data-route="reader" class="nav-btn"><span>▤</span><small>閱讀</small></button>
    <button data-route="review" class="nav-btn"><span>✦</span><small>重點</small></button>
    <button data-route="quiz" class="nav-btn"><span>✓</span><small>做題</small></button>
    <button data-route="stats" class="nav-btn"><span>◔</span><small>紀錄</small></button>
  </nav>
</div>
<div id="modal" class="modal hidden"><div class="modal-card"><button id="modalClose" class="modal-close">×</button><div id="modalBody"></div></div></div>
<script src="content.js?v=7.0.0"></script><script src="questions.js?v=7.0.0"></script><script src="review.js?v=7.0.0"></script><script src="app.js?v=7.0.0"></script>
</body></html>
